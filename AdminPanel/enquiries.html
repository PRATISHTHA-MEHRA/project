<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enquiries - BrightPath Admin</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/admin-style.css">
</head>
<body>
<script src="assets/js/api.js"></script>
<script src="assets/js/admin-data.js"></script>
<script src="assets/js/admin-app.js"></script>
<script>
if(App.guard()){

  const CLASS_LEVELS = ['Class 8','Class 9','Class 10','Class 11','Class 12'];
  const SOURCES = ['Walk-in','Referral','Newspaper','Social Media','Website','Other'];
  const TIMINGS = ['Morning','Afternoon','Evening'];
  const STATUSES = ['New','Contacted','Interested','Demo Scheduled','Demo Completed','Converted','Lost'];
  const FEE_TYPES = ['Monthly Fee','Quarterly Fee','Semi-Annual Fee','Annual Fee'];
  const FEE_FIELD_BY_TYPE = {
    'Monthly Fee':'monthly_fee',
    'Quarterly Fee':'quarterly_fee',
    'Semi-Annual Fee':'semi_annual_fee',
    'Annual Fee':'annual_fee'
  };

  const head = `<button class="btn btn-primary" onclick="addEnq()">${App.svg('plus')}New Enquiry</button>`;
  const c = App.layout('enquiries','Enquiries',['Enquiries'],head);

  const esc = v => String(v ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const jsStr = v => String(v ?? '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
  const unique = values => [...new Set(values.filter(Boolean))];

  let currentEnquiries = [];
  let courses = [];

  const findCurrentEnquiry = id => currentEnquiries.find(e => String(e.id) === String(id));

  const findMatchingCourse = (courseName) =>
    courses.find(c => (c.course_name || '').trim().toLowerCase() === (courseName || '').trim().toLowerCase());

  function mapEnquiry(item = {}){
    return {
      id: item.id || '', 
      name: item.name || 'Unnamed Student', 
      parent: item.parent || '',
      mobile: item.mobile || '', 
      cls: item.cls || '', 
      course: item.course || '', 
      demoDate: item.demoDate || '', 
      demoTime: item.demoTime || '',
      source: item.source || 'Walk-in',
      sourceDetail: item.sourceDetail || item.source_detail || '',
      timing: item.timing || '', 
      followup: item.followup || '',
      counselor: item.counselor || '', 
      status: item.status || 'New',
      remarks: item.remarks || '', 
      date: item.date || ''
    };
  }

  function toApiPayload(e){
    return {
      name: e.name, 
      parent: e.parent, 
      mobile: e.mobile, 
      cls: e.cls, 
      course: e.course, 
      demoDate: e.demoDate, 
      demoTime: e.demoTime,
      source: e.source, 
      sourceDetail: e.sourceDetail,
      timing: e.timing, 
      followup: e.followup, 
      counselor: e.counselor,
      status: e.status, 
      remarks: e.remarks
    };
  }

  // Toggle Source Detail field dynamically
  window.toggleSourceDetail = function(sourceVal) {
    const detailBox = document.getElementById('source_detail_wrap');
    if (detailBox) {
      const needsDetail = ['Referral', 'Newspaper', 'Social Media', 'Website', 'Other'].includes(sourceVal);
      detailBox.style.display = needsDetail ? 'block' : 'none';
    }
  };

  function readForm(box){
    const status = box.querySelector('#e_status')?.value || 'New';
    const source = box.querySelector('#e_source')?.value || 'Walk-in';

    return {
      name: box.querySelector('#e_name').value.trim(),
      parent: box.querySelector('#e_parent').value.trim(),
      mobile: box.querySelector('#e_mobile').value.trim(),
      cls: box.querySelector('#e_cls').value,
      course: box.querySelector('#e_course').value,
      demoDate: box.querySelector('#e_demodate')?.value || box.querySelector('#e_follow')?.value || '',
      demoTime: box.querySelector('#e_demotime')?.value.trim() || '',
      source: source,
      sourceDetail: box.querySelector('#e_source_detail')?.value.trim() || '',
      timing: box.querySelector('#e_timing').value,
      followup: box.querySelector('#e_follow').value,
      counselor: box.querySelector('#e_couns').value.trim(),
      status: status,
      remarks: box.querySelector('#e_rem').value.trim()
    };
  }

  function validateEnquiry(data) {
    if (!data.name) return 'Please enter the student\'s full name.';
    if (data.mobile && !/^\d{10}$/.test(data.mobile)) return 'Contact mobile number must be exactly 10 digits.';
    if (!data.course) return 'Please select a course of interest.';
    return null;
  }
let batches = [];

async function loadLookups(){
  try {
    const [courseRes, batchRes] = await Promise.all([
      API.get('/courses'),
      API.get('/batches').catch(() => ({ data: [] }))
    ]);
    courses = courseRes?.data || [];
    batches = batchRes?.data || [];
  } catch (err) {
    console.warn('Could not load lookup datasets:', err);
    courses = [];
    batches = [];
  }
}
  function renderPage(rows){
    currentEnquiries = rows;
    const converted = rows.filter(e => e.status === 'Converted').length;
    const open = rows.filter(e => ['New','Contacted','Interested','Demo Scheduled','Demo Completed'].includes(e.status)).length;
    const rate = rows.length ? Math.round(converted / rows.length * 100) : 0;

    c.innerHTML = `<div class="kpi-grid">
      <div class="kpi"><div class="top"><span class="label">Total Enquiries</span><span class="ic b-brand">${App.svg('enquiry')}</span></div><div class="val">${rows.length}</div></div>
      <div class="kpi"><div class="top"><span class="label">New / Open</span><span class="ic b-blue">${App.svg('bell')}</span></div><div class="val">${open}</div></div>
      <div class="kpi"><div class="top"><span class="label">Converted</span><span class="ic b-green">${App.svg('check')}</span></div><div class="val">${converted}</div></div>
      <div class="kpi"><div class="top"><span class="label">Conversion Rate</span><span class="ic b-amber">${App.svg('trending')}</span></div><div class="val">${rate}%</div></div>
    </div><div id="tbl"></div>`;

    if (!rows.length){
      document.getElementById('tbl').innerHTML = `<div class="empty-state">No enquiry records available yet.</div>`;
      return;
    }

    App.table('tbl',{
      rows,
      searchKeys:['id','name','mobile','course','counselor','sourceDetail'],
      searchPlaceholder:'Search by student, mobile, course, counselor...',
      pageSize:9,
      dateFilter:true,
      filters:[
        {label:'Status',key:'status',options:unique([...STATUSES, ...rows.map(e=>e.status)])},
        {label:'Source',key:'source',options:unique([...SOURCES, ...rows.map(e=>e.source)])},
        {label:'Counselor',key:'counselor',options:unique(rows.map(e=>e.counselor))}
      ],
      columns:[
        {key:'name',label:'Student Name',render:r=>`<div><strong>${esc(r.name)}</strong>${r.parent ? `<br><small class="text-muted">Parent: ${esc(r.parent)}</small>` : ''}</div>`},
        {key:'mobile',label:'Contact No.',render:r=>esc(r.mobile || '-')},
        {key:'course',label:'Course Interest',render:r=>esc(r.course || '-')},
        {key:'source',label:'Source Details',render:r=>`<span class="chip">${esc(r.source)}${r.sourceDetail ? ` - ${esc(r.sourceDetail)}` : ''}</span>`},
        {key:'counselor',label:'Counselor',render:r=>esc(r.counselor || '-')},
        {key:'followup',label:'Follow-up Date',render:r=>esc(r.followup || '-')},
        {key:'status',label:'Status',render:r=>App.badge(esc(r.status))}
      ],
      actions:r=>{
        const convertBtn = r.status === 'Converted' ? '' : App.actBtn('admit','Convert',`onclick="convertE('${jsStr(r.id)}')"` );
        return `${App.actBtn('eye','View',`onclick="viewE('${jsStr(r.id)}')"`)}${App.actBtn('edit','Edit',`onclick="editE('${jsStr(r.id)}')"`)}${convertBtn}`;
      }
    });
  }

  async function loadEnquiries(){
    try {
      const payload = await API.get('/enquiries');
      renderPage((payload?.data || []).map(mapEnquiry));
    } catch (err) {
      App.toast(err.message || 'Failed to load enquiries from server','err');
      renderPage([]);
    }
  }

  function eForm(x) {
    const courseNames = unique(courses.map(c => c.course_name));
    const editableStatuses = STATUSES.filter(s => s !== 'Converted');
    const selectedSource = x?.source || SOURCES[0];
    const showSourceDetail = ['Referral', 'Newspaper', 'Social Media', 'Website', 'Other'].includes(selectedSource);

    return `<div class="form-grid">
      <div>
        <label>Student Name <span class="text-danger">*</span></label>
        <input id="e_name" value="${esc(x?.name || '')}" placeholder="e.g. Rahul Sharma">
      </div>
      <div>
        <label>Parent Name</label>
        <input id="e_parent" value="${esc(x?.parent || '')}" placeholder="e.g. Suresh Sharma">
      </div>
      <div>
        <label>Mobile Number</label>
        <input id="e_mobile" value="${esc(x?.mobile || '')}" maxlength="10" inputmode="numeric" placeholder="10-digit mobile number" oninput="this.value=this.value.replace(/\\D/g,'').slice(0,10)">
      </div>
      <div>
        <label>Class / Level</label>
        <select id="e_cls">${CLASS_LEVELS.map(k=>`<option ${x?.cls===k?'selected':''}>${esc(k)}</option>`).join('')}</select>
      </div>
      <div>
        <label>Course Interested <span class="text-danger">*</span></label>
        <select id="e_course">
          <option value="">-- Select Course --</option>
          ${courseNames.map(cn=>`<option ${x?.course===cn?'selected':''}>${esc(cn)}</option>`).join('')}
        </select>
      </div>

      <div>
        <label>Source Type</label>
        <select id="e_source" onchange="toggleSourceDetail(this.value)">
          ${SOURCES.map(s=>`<option ${selectedSource===s?'selected':''}>${esc(s)}</option>`).join('')}
        </select>
      </div>

      <div id="source_detail_wrap" style="display: ${showSourceDetail ? 'block' : 'none'};">
        <label>Source Name / Platform Details</label>
        <input id="e_source_detail" value="${esc(x?.sourceDetail || '')}" placeholder="e.g., Referred by Amit, Facebook, Times Ad">
      </div>

      <div>
        <label>Preferred Timing</label>
        <select id="e_timing">${TIMINGS.map(t=>`<option ${x?.timing===t?'selected':''}>${t}</option>`).join('')}</select>
      </div>
      <div>
        <label>Follow-up Date</label>
        <input type="date" id="e_follow" value="${esc(x?.followup || '')}">
      </div>
      <div>
        <label>Counselor Name</label>
        <input id="e_couns" value="${esc(x?.counselor || '')}" placeholder="Assigned Counselor">
      </div>
      <div>
        <label>Enquiry Status</label>
        <select id="e_status">
          ${editableStatuses.map(s=>`<option ${x?.status===s?'selected':''}>${esc(s)}</option>`).join('')}
        </select>
      </div>

      <div class="full">
        <label>Remarks / Notes</label>
        <textarea id="e_rem" rows="2" placeholder="Enter any additional notes or conversation summary...">${esc(x?.remarks || '')}</textarea>
      </div>
    </div>`;
  }

  function showEnquiryModal(x){
    if (!x || !x.id) return App.toast('Selected enquiry record not found', 'err');
    App.modal({
      size:'lg',
      title:esc(x.name),
      sub:`Enquiry ID: ${esc(x.id)} - Status: ${esc(x.status)}`,
      body:`<div class="dl cols-2">
        <div class="it"><div class="k">Parent Name</div><div class="v">${esc(x.parent) || '-'}</div></div>
        <div class="it"><div class="k">Contact Mobile</div><div class="v">${esc(x.mobile) || '-'}</div></div>
        <div class="it"><div class="k">Class Level</div><div class="v">${esc(x.cls) || '-'}</div></div>
        <div class="it"><div class="k">Course Interest</div><div class="v">${esc(x.course) || '-'}</div></div>
        <div class="it"><div class="k">Lead Source & Details</div><div class="v">${esc(x.source)}${x.sourceDetail ? ` (${esc(x.sourceDetail)})` : ''}</div></div>
        <div class="it"><div class="k">Preferred Timing</div><div class="v">${esc(x.timing) || '-'}</div></div>
        <div class="it"><div class="k">Counselor</div><div class="v">${esc(x.counselor) || '-'}</div></div>
        <div class="it"><div class="k">Follow-up Date</div><div class="v">${esc(x.followup) || '-'}</div></div>
      </div>
      <div class="sec-title" style="margin-top:16px;">Remarks</div>
      <p style="color:var(--ink-2); background: var(--bg-2, #f8f9fa); padding: 8px 12px; border-radius: 6px;">${esc(x.remarks) || 'No additional remarks recorded.'}</p>`,
      foot:`<button class="btn btn-light" data-close>Close</button>${x.status === 'Converted' ? '' : `<button class="btn btn-primary" onclick="App.closeModal();convertE('${jsStr(x.id)}')">Convert to Admission</button>`}`
    });
  }

  window.viewE = id => showEnquiryModal(findCurrentEnquiry(id));

  window.addEnq = () => App.modal({
    size:'lg',
    title:'New Enquiry',
    body: eForm(null),
    foot:`<button class="btn btn-light" data-close>Cancel</button><button class="btn btn-primary" id="sv">Save Enquiry</button>`,
    onOpen: box => box.querySelector('#sv').onclick = async () => {
      const enquiry = readForm(box);
      const errorMsg = validateEnquiry(enquiry);
      if (errorMsg) return App.toast(errorMsg, 'err');

      try {
        await API.post('/enquiries', toApiPayload(enquiry));
        App.closeModal();
        await loadEnquiries();
        App.toast('New enquiry saved successfully','ok');
      } catch (err) {
        App.toast(err.message || 'Error saving enquiry. Please try again.','err');
      }
    }
  });

window.editE = id => {
    const x = findCurrentEnquiry(id);
    if (!x) return App.toast('Selected enquiry record not found', 'err');
    
    App.modal({
      size: 'lg',
      title: 'Edit Enquiry',
      sub: `ID: ${esc(x.id)}`,
      body: eForm(x),
      foot: `<button class="btn btn-light" data-close>Cancel</button><button class="btn btn-primary" id="sv">Save Changes</button>`,
      onOpen: box => {
        box.querySelector('#sv').onclick = async () => {
          const enquiry = readForm(box);
          const errorMsg = validateEnquiry(enquiry);
          if (errorMsg) return App.toast(errorMsg, 'err');

          try {
            await API.put(`/enquiries/${encodeURIComponent(x.id)}`, toApiPayload(enquiry));
            App.closeModal();
            await loadEnquiries();
            App.toast('Enquiry details updated successfully', 'ok');
          } catch (err) {
            App.toast(err.message || 'Error updating enquiry details', 'err');
          }
        };
      }
    });
  };
function convertForm(x, matchedCourse){
  if (!matchedCourse) {
    return `<div class="empty-state">
      Course "${esc(x.course)}" from this enquiry doesn't match any registered course.
      Please update the enquiry's course to an active course before converting.
    </div>`;
  }

  // Safely filter batches matching the course name returned by mapToFrontend
  const targetCourseName = (matchedCourse.course_name || '').trim().toLowerCase();
  const courseBatches = batches.filter(b => 
    (b.course || '').trim().toLowerCase() === targetCourseName
  );

  return `<div class="form-grid">
    <div class="full">
      <div class="sec-title" style="font-weight:600; margin-bottom: 8px;">1. Personal & Contact Info</div>
    </div>
    
    <div>
      <label>Student Name <span class="text-danger">*</span></label>
      <input id="cv_name" value="${esc(x.name)}" placeholder="Full Name">
    </div>
    <div>
      <label>Student Mobile <span class="text-danger">*</span></label>
      <input id="cv_mobile" value="${esc(x.mobile)}" maxlength="10" placeholder="10-digit mobile" oninput="this.value=this.value.replace(/\\D/g,'').slice(0,10)">
    </div>
    <div>
      <label>Parent Name <span class="text-danger">*</span></label>
      <input id="cv_parent" value="${esc(x.parent)}" placeholder="Parent / Guardian Name">
    </div>
    <div>
      <label>Parent Mobile <span class="text-danger">*</span></label>
      <input id="cv_parent_mobile" maxlength="10" placeholder="10-digit parent mobile" oninput="this.value=this.value.replace(/\\D/g,'').slice(0,10)">
    </div>
    <div>
      <label>Gender <span class="text-danger">*</span></label>
      <select id="cv_gender">
        <option value="M">Male</option>
        <option value="F">Female</option>
        <option value="O">Other</option>
      </select>
    </div>
    <div>
      <label>Date of Birth <span class="text-danger">*</span></label>
      <input type="date" id="cv_dob">
    </div>
    <div>
      <label>School Name <span class="text-danger">*</span></label>
      <input id="cv_school" placeholder="Current or Previous School">
    </div>
    <div>
      <label>Address <span class="text-danger">*</span></label>
      <input id="cv_address" placeholder="Residential Address">
    </div>

    <div class="full" style="margin-top: 12px;">
      <div class="sec-title" style="font-weight:600; margin-bottom: 8px;">2. Course & Batch Assignment</div>
    </div>

    <div>
      <label>Class Level <span class="text-danger">*</span></label>
      <select id="cv_cls">
        ${CLASS_LEVELS.map(k => `<option ${x.cls === k ? 'selected' : ''}>${esc(k)}</option>`).join('')}
      </select>
    </div>
    <div>
      <label>Course Selected</label>
      <input id="cv_course" value="${esc(matchedCourse.course_name)}" disabled style="background:#f1f5f9;">
    </div>
    <div class="full">
      <label>Assigned Batch <span class="text-danger">*</span></label>
      <select id="cv_batch">
        ${courseBatches.length > 0 
          ? courseBatches.map(b => {
              // Extract batch name from b.name (mapped by backend mapToFrontend)
              const batchName = b.name || b.batch_name || 'Unnamed Batch';
              return `<option value="${esc(batchName)}">${esc(batchName)}</option>`;
            }).join('')
          : `<option value="Regular Batch">Regular Batch</option>`
        }
      </select>
    </div>
    


    <div class="full" style="margin-top: 12px;">
      <div class="sec-title" style="font-weight:600; margin-bottom: 8px;">3. Fee Details & Initial Payment</div>
    </div>

    <div>
      <label>Fee Schedule <span class="text-danger">*</span></label>
      <select id="cv_feetype">
        ${FEE_TYPES.map(t => `<option>${t}</option>`).join('')}
      </select>
    </div>
    <div>
      <label>Total Fee Amount <span class="text-danger">*</span></label>
      <input type="number" id="cv_feeamount" step="0.01" placeholder="0.00">
    </div>
    <div>
      <label>Amount Paid Now</label>
      <input type="number" id="cv_paid" step="0.01" value="0.00">
    </div>
    <div>
      <label>Discount</label>
      <input type="number" id="cv_discount" step="0.01" value="0.00">
    </div>
    <div>
      <label>Payment Mode</label>
      <select id="cv_mode">
        <option>Cash</option>
        <option>UPI</option>
        <option>Card</option>
        <option>Bank Transfer</option>
      </select>
    </div>
    <div>
      <label>Admission Date <span class="text-danger">*</span></label>
      <input type="date" id="cv_date" value="${new Date().toISOString().split('T')[0]}">
    </div>
  </div>`;
}

window.convertE = id => {
    const x = findCurrentEnquiry(id);
    if (!x) return App.toast('Enquiry record not found', 'err');

    const matchedCourse = findMatchingCourse(x.course);

    App.modal({
      size:'lg',
      title:`Convert ${esc(x.name)} to Admission`,
      sub:`Enquiry Reference: ${esc(x.id)}`,
      body: convertForm(x, matchedCourse),
      foot: matchedCourse
        ? `<button class="btn btn-light" data-close>Cancel</button><button class="btn btn-primary" id="cv_sv">Convert to Student</button>`
        : `<button class="btn btn-light" data-close>Close</button>`,
      onOpen: box => {
        if (!matchedCourse) return;

        const feeTypeSel = box.querySelector('#cv_feetype');
        const feeAmountInput = box.querySelector('#cv_feeamount');

        const refreshFeeAmount = () => {
          const field = FEE_FIELD_BY_TYPE[feeTypeSel.value];
          if (field && matchedCourse[field] != null) feeAmountInput.value = matchedCourse[field];
        };
        feeTypeSel.onchange = refreshFeeAmount;
        refreshFeeAmount();

box.querySelector('#cv_sv').onclick = async () => {
          const payload = {
  name: box.querySelector('#cv_name').value.trim(),
  mobile: box.querySelector('#cv_mobile').value.trim(),
  parent: box.querySelector('#cv_parent').value.trim(),
  parentMobile: box.querySelector('#cv_parent_mobile').value.trim(),
  gender: box.querySelector('#cv_gender').value,
  dob: box.querySelector('#cv_dob').value,
  school: box.querySelector('#cv_school').value.trim(),
  address: box.querySelector('#cv_address').value.trim(),
  cls: box.querySelector('#cv_cls').value,
  batch: box.querySelector('#cv_batch').value,
  feeType: feeTypeSel.value,
  feeAmt: Number(feeAmountInput.value) || 0,
  paid: Number(box.querySelector('#cv_paid').value) || 0,
  discount: Number(box.querySelector('#cv_discount').value) || 0,
  fine: 0,
  mode: box.querySelector('#cv_mode').value,
  admission: box.querySelector('#cv_date').value,
  feeStatus: box.querySelector('#cv_feeStatus')?.value || undefined
};
          // Validation matching your controller constraints
          if (!payload.name) return App.toast('Student Name is required', 'err');
          if (!payload.mobile || !/^\d{10}$/.test(payload.mobile)) return App.toast('Enter a valid 10-digit student mobile number', 'err');
          if (!payload.parent) return App.toast('Parent Name is required', 'err');
          if (!payload.parentMobile || !/^\d{10}$/.test(payload.parentMobile)) return App.toast('Enter a valid 10-digit parent mobile number', 'err');
          if (!payload.gender) return App.toast('Gender is required', 'err');
          if (!payload.dob) return App.toast('Date of Birth is required', 'err');
          if (!payload.school) return App.toast('School Name is required', 'err');
          if (!payload.address) return App.toast('Address is required', 'err');
          if (!payload.batch) return App.toast('Assigned Batch is required', 'err');
          if (!payload.feeAmt || payload.feeAmt < 0) return App.toast('Please enter a valid fee amount', 'err');
          if (!payload.admission) return App.toast('Admission Date is required', 'err');

          try {
            await API.post(`/enquiries/${encodeURIComponent(x.id)}/convert`, payload);
            App.closeModal();
            App.toast('Enquiry converted into student admission successfully!', 'ok');
            location.href = 'admissions.html';
          } catch (err) {
            App.toast(err.message || 'Failed to complete admission conversion', 'err');
          }
        
        };

        } // Properly closed onOpen callback
  }); // Properly closed App.modal call
}; // Properly closed window.convertE function
       

  (async function init(){
    await loadLookups();
    await loadEnquiries();
  })();
}
</script>
</body>
</html>
