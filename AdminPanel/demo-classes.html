<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo Classes - BrightPath Admin</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/admin-style.css">
</head>
<body>
<script src="assets/js/api.js"></script>
<script src="assets/js/admin-data.js"></script>
<script src="assets/js/admin-app.js"></script>
<script>
if(App.guard()){

  const statuses = ["Scheduled","Completed","Cancelled","No Show"];
  const ENDPOINT = "/demo-classes";
  let currentDemos = [];

  // Real data backing the Schedule/Edit Demo form dropdowns. Loaded once on
  // page load (loadDropdownData) alongside the demos table itself.
  let coursesList = [];
  let teachersList = [];
  let batchesList = [];

  const head = `<button class="btn btn-primary" onclick="addDemo()">${App.svg('plus')}Schedule Demo</button>`;
  const c = App.layout('demo-classes','Demo Classes',['Demo Classes'],head);
  c.innerHTML = `<div id="tbl"></div>`;

  const esc = v => String(v ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const jsStr = v => String(v ?? '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
  const findCurrentDemo = id => currentDemos.find(d => String(d.id) === String(id));

  function unwrapList(payload){
    if (Array.isArray(payload)) return payload;
    if (Array.isArray(payload?.data)) return payload.data;
    if (Array.isArray(payload?.demos)) return payload.demos;
    if (Array.isArray(payload?.rows)) return payload.rows;
    if (Array.isArray(payload?.result)) return payload.result;
    return [];
  }

  // Defensive field readers - exact column-alias names returned by the
  // enquiries/courses/teachers/batches endpoints weren't all confirmed, so
  // each helper checks a couple of likely keys the same way homework.html /
  // study-material.html already do for batches/teachers.
  const courseName = c => c.name || c.course_name || '';
  const teacherName = t => t.name || t.teacher_name || '';
  const batchName = b => b.name || b.batch_name || '';
  const batchCourseId = b => b.course_id ?? b.courseId ?? null;
  const batchCourseName = b => b.course_name || b.course || b.courseName || null;

  function toApiPayload(d){
    return {
      student: d.student,
      course: d.course,
      batch: d.batch,
      teacher: d.teacher,
      date: d.date,
      time: d.time,
      status: d.status,
      feedback: d.feedback || '-'
    };
  }

  function readForm(box){
    return {
      student: box.querySelector('#d_stu').value.trim(),
      course: box.querySelector('#d_course').value,
      batch: box.querySelector('#d_batch').value,
      teacher: box.querySelector('#d_teacher').value,
      date: box.querySelector('#d_date').value,
      time: box.querySelector('#d_time').value.trim(),
      status: box.querySelector('#d_status').value,
      feedback: box.querySelector('#d_feedback').value.trim() || '-'
    };
  }

  function renderTable(rows){
    currentDemos = rows;
    App.table('tbl',{
      rows,
      searchKeys:['id','student','course','teacher','batch'],
      searchPlaceholder:'Search demos...',
      pageSize:9,
      dateFilter:true,
      filters:[
        {label:'Status',key:'status',options:statuses},
        {label:'Course',key:'course',options:[...new Set(rows.map(d=>d.course).filter(Boolean))]}
      ],
      columns:[
        {key:'student',label:'Student',render:r=>`<div class="t-main">${esc(r.student)}</div><div class="t-sub">${esc(r.id)}</div>`},
        {key:'course',label:'Course',render:r=>esc(r.course)},
        {key:'batch',label:'Batch',render:r=>esc(r.batch) || '<span class="t-sub">Not set</span>'},
        {key:'teacher',label:'Teacher',render:r=>App.whoCell(esc(r.teacher || '-'))},
        {key:'date',label:'Date & Time',render:r=>`<div>${esc(r.date) || '<span class="t-sub">Not set</span>'}</div><div class="t-sub num">${esc(r.time)}</div>`},
        {key:'status',label:'Status',render:r=>App.badge(esc(r.status))}
      ],
      actions:r=>`${App.actBtn('eye','View',`onclick="viewD('${jsStr(r.id)}')"`) }${App.actBtn('edit','Edit',`onclick="editD('${jsStr(r.id)}')"`) }${App.actBtn('check','Mark Complete',`onclick="mark('${jsStr(r.id)}')"`) }${App.actBtn('admit','Convert',`onclick="convertDemo('${jsStr(r.id)}')"`) }`
    });
  }

  async function loadDemos(){
    try {
      const payload = await API.get(ENDPOINT);
      renderTable(unwrapList(payload));
    } catch (err) {
      App.toast(err.message || 'Failed to load demos','err');
      renderTable([]);
    }
  }

  // Loads the real course/teacher/batch lists the Schedule/Edit Demo form needs.
  async function loadDropdownData(){
    try {
      const [crs, tch, bth] = await Promise.all([
        API.get('/courses'),
        API.get('/teachers'),
        API.get('/batches')
      ]);
      coursesList = unwrapList(crs);
      teachersList = unwrapList(tch).filter(t => !t.status || t.status === 'Active');
      batchesList = unwrapList(bth);
    } catch (err) {
      App.toast('Failed to load course/batch/teacher data','err');
    }
  }

  function showDemoModal(x){
    if (!x || !x.id) return App.toast('Demo class not found', 'err');
    App.modal({size:'md',title:'Demo Class - '+esc(x.student),sub:esc(x.id),
      body:`<div class="dl cols-2"><div class="it"><div class="k">Course</div><div class="v">${esc(x.course)}</div></div>
        <div class="it"><div class="k">Batch</div><div class="v">${esc(x.batch)}</div></div>
        <div class="it"><div class="k">Teacher</div><div class="v">${esc(x.teacher)}</div></div><div class="it"><div class="k">Date</div><div class="v">${esc(x.date)} - ${esc(x.time)}</div></div>
        <div class="it"><div class="k">Status</div><div class="v">${App.badge(esc(x.status))}</div></div></div>
      <div class="sec-title">Feedback</div><p style="color:var(--ink-2)">${esc(x.feedback)}</p>`,
      foot:`<button class="btn btn-light" data-close>Close</button><button class="btn btn-amber" onclick="App.toast('Reminder sent to student','ok')">${App.svg('whatsapp')}Remind</button><button class="btn btn-primary" onclick="App.closeModal();convertDemo('${jsStr(x.id)}')">Convert</button>`
    });
  }

  // Batch options are scoped to the currently-selected course. The exact
  // field the batches API uses to link to a course wasn't confirmed, so this
  // matches on course_id/courseId OR on a course name field, whichever the
  // batch record actually has. If the batches API turns out not to expose
  // any course link at all, fall back to listing every batch rather than
  // silently showing none.
  function batchOptionsFor(course, selectedBatchName){
    if (!course) return `<option value="">Select course first...</option>`;
    const hasAnyCourseLink = batchesList.some(b => batchCourseId(b) != null || batchCourseName(b));
    let filtered = batchesList.filter(b => {
      const bId = batchCourseId(b);
      const bName = batchCourseName(b);
      if (bId != null && course.id != null && String(bId) === String(course.id)) return true;
      if (bName && course.name && bName === course.name) return true;
      return false;
    });
    if (!filtered.length && !hasAnyCourseLink) {
      console.warn('demo.html: batches API returned no course_id/course name field on any batch - listing all batches unfiltered', batchesList);
      filtered = batchesList;
    } else if (!filtered.length) {
      console.warn('demo.html: no batch matched course', course, batchesList);
    }
    if (!filtered.length) return `<option value="">No batches for this course</option>`;
    return `<option value="">Select batch...</option>` + filtered.map(b =>
      `<option value="${esc(batchName(b))}" ${selectedBatchName === batchName(b) ? 'selected' : ''}>${esc(batchName(b))}</option>`
    ).join('');
  }

  function demoForm(x){
    const courseOptions = coursesList.map(c =>
      `<option value="${esc(courseName(c))}" data-id="${esc(c.id)}" ${x?.course === courseName(c) ? 'selected' : ''}>${esc(courseName(c))}</option>`
    ).join('');

    const teacherOptions = teachersList.map(t =>
      `<option value="${esc(teacherName(t))}" ${x?.teacher === teacherName(t) ? 'selected' : ''}>${esc(teacherName(t))}</option>`
    ).join('');

    return `<div class="form-grid">
      <div><label>Student Name</label><input id="d_stu" value="${esc(x?.student || '')}" placeholder="Student name"></div>
      <div><label>Course</label>
        <select id="d_course">
          <option value="">Select course...</option>
          ${courseOptions}
        </select>
      </div>
      <div><label>Batch</label>
        <select id="d_batch">
          <option value="">Select course first...</option>
        </select>
      </div>
      <div><label>Teacher</label>
        <select id="d_teacher">
          <option value="">Select teacher...</option>
          ${teacherOptions}
        </select>
      </div>
      <div><label>Date</label><input type="date" id="d_date" value="${esc(x?.date || '')}"></div>
      <div><label>Time</label><input id="d_time" value="${esc(x?.time || '')}" placeholder="e.g. 04:30 PM"></div>
      <div><label>Status</label><select id="d_status">${statuses.map(s=>`<option ${x?.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
      <div class="full"><label>Feedback</label><textarea id="d_feedback" rows="2">${esc(x?.feedback || '-')}</textarea></div>
    </div>`;
  }

  // Wires the course -> batch cascade for a form instance. Call once right
  // after the form markup is inserted into the modal.
  function wireCascade(box, x){
    const courseSel = box.querySelector('#d_course');
    const batchSel = box.querySelector('#d_batch');

    function refreshBatches(preselect){
      const opt = courseSel.selectedOptions[0];
      const course = (opt && opt.value) ? { id: opt.dataset.id || null, name: opt.value } : null;
      batchSel.innerHTML = batchOptionsFor(course, preselect || '');
    }

    courseSel.addEventListener('change', () => refreshBatches(''));
    if (x?.course) refreshBatches(x.batch || '');
  }

  window.viewD = id => showDemoModal(findCurrentDemo(id));

  window.addDemo = () => App.modal({size:'lg',title:'Schedule Demo Class',
    body:demoForm(null),
    foot:`<button class="btn btn-light" data-close>Cancel</button><button class="btn btn-primary" id="sv">Schedule Demo</button>`,
    onOpen:box=>{
      wireCascade(box, null);
      box.querySelector('#sv').onclick=async()=>{
        const demo = readForm(box);
        if (!demo.student) return App.toast('Enter student name','err');
        if (!demo.course) return App.toast('Select a course','err');
        if (!demo.batch) return App.toast('Select a batch','err');
        if (!demo.teacher) return App.toast('Select a teacher','err');
        if (!demo.date) return App.toast('Select a demo date','err');
        if (!demo.time) return App.toast('Enter a demo time','err');
        try {
          await API.post(ENDPOINT, toApiPayload(demo));
          App.closeModal();
          await loadDemos();
          App.toast('Demo scheduled','ok');
        } catch (err) {
          App.toast(err.message || 'Failed to schedule demo','err');
        }
      };
    }
  });

  // Edit lets staff fill in / correct batch, teacher, date and time once a
  // demo exists (including placeholder demos auto-created when an enquiry's
  // status is set to "Demo Scheduled" from the Enquiries page).
  window.editD = id => {
    const x = findCurrentDemo(id);
    if (!x) return App.toast('Demo class not found', 'err');
    App.modal({size:'lg',title:'Edit Demo Class',sub:esc(x.id),body:demoForm(x),
      foot:`<button class="btn btn-light" data-close>Cancel</button><button class="btn btn-primary" id="sv">Save Changes</button>`,
      onOpen:box=>{
        wireCascade(box, x);
        box.querySelector('#sv').onclick=async()=>{
          const demo = readForm(box);
          if (!demo.student) return App.toast('Enter student name','err');
          if (!demo.course) return App.toast('Select a course','err');
          if (!demo.batch) return App.toast('Select a batch','err');
          if (!demo.teacher) return App.toast('Select a teacher','err');
          if (!demo.date) return App.toast('Select a demo date','err');
          if (!demo.time) return App.toast('Enter a demo time','err');
          try {
            await API.put(`${ENDPOINT}/${encodeURIComponent(x.id)}`, toApiPayload(demo));
            App.closeModal();
            await loadDemos();
            App.toast('Demo class updated','ok');
          } catch (err) {
            App.toast(err.message || 'Failed to update demo','err');
          }
        };
      }
    });
  };

  window.mark = async id => {
    const x = findCurrentDemo(id);
    if (!x) return App.toast('Demo class not found', 'err');
    const completed = {
      ...x,
      status:'Completed',
      feedback: x.feedback && x.feedback !== '-' ? x.feedback : 'Student participated well and was highly responsive.'
    };
    try {
      await API.put(`${ENDPOINT}/${encodeURIComponent(x.id)}`, toApiPayload(completed));
      await loadDemos();
      App.toast('Demo marked completed','ok');
    } catch (err) {
      App.toast(err.message || 'Failed to update demo','err');
    }
  };

window.convertDemo = async id => {
    const x = findCurrentDemo(id);
    if (!x) return App.toast('Demo class not found', 'err');

    // Step A: Pre-fetch details or locate matched enquiry info if available
    let matchedEnquiry = null;
    try {
      const enqPayload = await API.get('/enquiries');
      const allEnquiries = unwrapList(enqPayload);
      matchedEnquiry = allEnquiries.find(e => 
        (e.student_name || e.student || '').trim().toLowerCase() === (x.student || '').trim().toLowerCase() &&
        e.status !== 'Converted'
      ) || null;
    } catch (err) {
      console.warn('Could not load enquiry details for pre-filling:', err);
    }

    // Default fallback values extracted from demo record or matched enquiry
    const initName = x.student || matchedEnquiry?.student_name || matchedEnquiry?.name || '';
    const initMobile = matchedEnquiry?.mobile || '';
    const initParent = matchedEnquiry?.parent_name || matchedEnquiry?.parent || '';
    const initClass = matchedEnquiry?.class_level || matchedEnquiry?.cls || 'Class 10';

    // Step B: Build Modal Layout
    App.modal({
      size: 'lg',
      title: 'Convert Demo to Admission',
      sub: `Demo ID: ${esc(x.id)}`,
      body: `
        <div class="form-grid">
          <div class="full"><div class="sec-title" style="font-weight:600; margin-bottom:8px;">1. Personal & Contact Info</div></div>
          <div>
            <label>Student Name <span class="text-danger">*</span></label>
            <input id="cv_name" value="${esc(initName)}" placeholder="Full Name">
          </div>
          <div>
            <label>Student Mobile <span class="text-danger">*</span></label>
            <input id="cv_mobile" value="${esc(initMobile)}" maxlength="10" placeholder="10-digit mobile" oninput="this.value=this.value.replace(/\\D/g,'').slice(0,10)">
          </div>
          <div>
            <label>Parent Name <span class="text-danger">*</span></label>
            <input id="cv_parent" value="${esc(initParent)}" placeholder="Parent / Guardian Name">
          </div>
          <div>
            <label>Parent Mobile <span class="text-danger">*</span></label>
            <input id="cv_parent_mobile" maxlength="10" placeholder="10-digit parent mobile" oninput="this.value=this.value.replace(/\\D/g,'').slice(0,10)">
          </div>
          <div>
            <label>Gender <span class="text-danger">*</span></label>
            <select id="cv_gender">
              <option value="M">Male</option>
              <option value="F">Female</option>
              <option value="O">Other</option>
            </select>
          </div>
          <div>
            <label>Date of Birth <span class="text-danger">*</span></label>
            <input type="date" id="cv_dob">
          </div>
          <div>
            <label>School Name <span class="text-danger">*</span></label>
            <input id="cv_school" placeholder="Current or Previous School">
          </div>
          <div>
            <label>Address <span class="text-danger">*</span></label>
            <input id="cv_address" placeholder="Residential Address">
          </div>

          <div class="full" style="margin-top:12px;"><div class="sec-title" style="font-weight:600; margin-bottom:8px;">2. Class & Course Details</div></div>
          <div>
            <label>Class Level <span class="text-danger">*</span></label>
            <input id="cv_cls" value="${esc(initClass)}">
          </div>
          <div>
            <label>Course Selected</label>
            <input id="cv_course" value="${esc(x.course)}" disabled style="background:#f1f5f9;">
          </div>
          <div>
            <label>Assigned Batch</label>
            <input id="cv_batch" value="${esc(x.batch)}" disabled style="background:#f1f5f9;">
          </div>
          <div>
            <label>Assigned Teacher</label>
            <input id="cv_teacher" value="${esc(x.teacher)}" disabled style="background:#f1f5f9;">
          </div>

          <div class="full" style="margin-top:12px;"><div class="sec-title" style="font-weight:600; margin-bottom:8px;">3. Initial Fee & Payment</div></div>
          <div>
            <label>Total Fee Amount (₹)</label>
            <input type="number" id="cv_feeAmt" value="0" min="0">
          </div>
          <div>
            <label>Amount Paid (₹)</label>
            <input type="number" id="cv_paid" value="0" min="0">
          </div>
          <div>
            <label>Payment Mode</label>
            <select id="cv_mode">
              <option value="Cash">Cash</option>
              <option value="UPI">UPI / Online</option>
              <option value="Card">Card</option>
              <option value="Bank Transfer">Bank Transfer</option>
            </select>
          </div>
          <div>
            <label>Admission Date</label>
            <input type="date" id="cv_admission" value="${new Date().toISOString().slice(0, 10)}">
          </div>
        </div>
      `,
      foot: `<button class="btn btn-light" data-close>Cancel</button><button class="btn btn-primary" id="confirm_cv_btn">Confirm & Convert</button>`,
      onOpen: (box) => {
        box.querySelector('#confirm_cv_btn').onclick = async () => {
          const payload = {
            name: box.querySelector('#cv_name').value.trim(),
            mobile: box.querySelector('#cv_mobile').value.trim(),
            parent: box.querySelector('#cv_parent').value.trim(),
            parentMobile: box.querySelector('#cv_parent_mobile').value.trim(),
            gender: box.querySelector('#cv_gender').value,
            dob: box.querySelector('#cv_dob').value,
            school: box.querySelector('#cv_school').value.trim(),
            address: box.querySelector('#cv_address').value.trim(),
            cls: box.querySelector('#cv_cls').value.trim(),
            course: x.course,
            batch: x.batch,
            teacher: x.teacher,
            feeType: "Demo Conversion",
            feeAmt: Number(box.querySelector('#cv_feeAmt').value) || 0,
            paid: Number(box.querySelector('#cv_paid').value) || 0,
            discount: 0,
            fine: 0,
            mode: box.querySelector('#cv_mode').value,
            admission: box.querySelector('#cv_admission').value
          };

          // Basic Field Validations
          if (!payload.name) return App.toast('Please enter student name', 'err');
          if (!payload.mobile || payload.mobile.length !== 10) return App.toast('Please enter a valid 10-digit student mobile number', 'err');
          if (!payload.parent) return App.toast('Please enter parent name', 'err');

          try {
            await API.post(`${ENDPOINT}/${encodeURIComponent(x.id)}/convert`, payload);
            App.closeModal();
            App.toast('Demo converted to admission successfully!', 'ok');
            location.href = 'admissions.html';
          } catch (err) {
            App.toast(err.message || 'Failed to convert demo', 'err');
          }
        };
      }
    });
  };
  Promise.all([loadDemos(), loadDropdownData()]);
}
</script>
</body></html>
