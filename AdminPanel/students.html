<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Students - BrightPath Admin</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/admin-style.css">
<style>

  .locked-field, .locked-field:disabled {
    background: #f1f2f4 !important;
    color: #8a8f98 !important;
    -webkit-text-fill-color: #8a8f98 !important; 
    opacity: 1 !important;
    cursor: not-allowed !important;
    border-color: #e2e4e8 !important;
  }
</style>
</head>
<body>
<script src="assets/js/admin-data.js"></script>
<script src="assets/js/admin-app.js"></script>
<script src="assets/js/api.js"></script>

<script>
if(App.guard()){
  const API_BASE = "/students"; 
  const statuses = ["Active", "Inactive"];
  const feeStatuses = ["Paid", "Pending", "Overdue"];
  let usingFallback = false;
  let currentStudents = [];
  let courseList = []; 
  let batchList = [];  

  const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const quarters = [
    { value:'Q1', label:'Q1 (Jan-Mar)' },
    { value:'Q2', label:'Q2 (Apr-Jun)' },
    { value:'Q3', label:'Q3 (Jul-Sep)' },
    { value:'Q4', label:'Q4 (Oct-Dec)' }
  ];
  const halves = [
    { value:'H1', label:'H1 (Jan-Jun)' },
    { value:'H2', label:'H2 (Jul-Dec)' }
  ];

  const head = `<button class="btn btn-light" onclick="exportStudents()">${App.svg('download')}Export</button>
    <button class="btn btn-primary" onclick="addStudent()">${App.svg('plus')}Add Student</button>`;
  const c = App.layout('students','Students',['Students'],head);

  const esc = v => String(v ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const jsStr = v => String(v ?? '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
  const asNum = v => Number(v ?? 0) || 0;
  const toDateStr = v => {
    if (!v) return '';
    if (typeof v === 'string') return v.slice(0,10);
    try { return new Date(v).toISOString().slice(0,10); } catch { return ''; }
  };
  const localStudents = () => (DB.students || []).map(mapStudent);
  const findLocalStudent = id => (DB.students || []).find(s => String(s.id) === String(id));
  const findCurrentStudent = id => currentStudents.find(s => String(s.id) === String(id));
  const unique = values => [...new Set(values.filter(Boolean))];

  function unwrapList(payload){
    if (Array.isArray(payload)) return payload;
    if (Array.isArray(payload?.data)) return payload.data;
    if (Array.isArray(payload?.students)) return payload.students;
    if (Array.isArray(payload?.courses)) return payload.courses;
    if (Array.isArray(payload?.batches)) return payload.batches;
    if (Array.isArray(payload?.data?.students)) return payload.data.students;
    return [];
  }

  // Courses/batches now ride along on the /students response (see
  // studentController.getStudents), so there's no separate /courses or
  // /batches call here anymore - just map whatever the API gave us.
  function mapCourseItem(x){
    return {
      id: String(x.id ?? ''),
      name: x.course_name ?? x.name ?? '',
      code: x.course_code ?? x.code ?? '',
      // Fee lives entirely on the course, split by billing frequency -
      // batches have no fee column of their own. courseFeeFor() below
      // picks the right one based on the selected Fee Type.
      monthlyFee: asNum(x.monthly_fee),
      quarterlyFee: asNum(x.quarterly_fee),
      semiAnnualFee: asNum(x.semi_annual_fee),
      annualFee: asNum(x.annual_fee)
    };
  }

  function mapBatchItem(x){
    return { id: String(x.id ?? x.batch_id ?? ''), name: x.name ?? x.batch_name ?? '', courseId: String(x.courseId ?? x.course_id ?? '') };
  }

  // Only used when the /students call itself fails outright (see catch
  // block in loadStudents) - mirrors the old API-unavailable fallback.
  function loadLocalDropdownData(){
    courseList = (DB.courses || []).map(x => ({
      id: String(x.id ?? ''), name: x.name || '', code: x.id || '',
      monthlyFee: asNum(x.monthly),
      // Local demo data only defines a single monthly figure - approximate
      // the other tiers from it since there's no dedicated fallback value.
      quarterlyFee: asNum(x.monthly) * 3,
      semiAnnualFee: asNum(x.monthly) * 6,
      annualFee: asNum(x.monthly) * 12
    }));
    batchList = (DB.batches || []).map(x => ({ id: String(x.id ?? ''), name: x.name || '', courseId: String(x.courseId ?? x.course_id ?? '') }));
  }

  // Batches belonging to a given course. Batches with no courseId info
  // (e.g. the local fallback list, or older cached data) are always shown
  // rather than hidden, since there's nothing to filter them against.
  const batchesForCourse = (courseId) => batchList.filter(b => !b.courseId || b.courseId === courseId);

  // The course's fee for a given billing frequency - reuses the same
  // substring matching already used in collectFee() to classify a Fee Type
  // string as monthly/quarterly/half-yearly/annual, so "Quarterly Fee",
  // "Half Yearly Fee", "Annual Fee", etc. all resolve consistently.
  const courseFeeFor = (courseId, feeTypeStr) => {
    const course = courseList.find(c => c.id === courseId);
    if (!course) return null;
    const t = String(feeTypeStr || '').toLowerCase();
    if (t.includes('quarter')) return course.quarterlyFee;
    if (t.includes('half') || t.includes('semi')) return course.semiAnnualFee;
    if (t.includes('annual') || t.includes('year')) return course.annualFee;
    return course.monthlyFee;
  };

  function mapStudent(item = {}){
    const course = item.course ?? item.course_name ?? '';
    const batch = item.batch ?? item.batch_name ?? '';
    const courseObj = (DB.courses || []).find(c => c.name === course || c.course_name === course);
    return {
      id: String(item.id ?? ''),
      code: item.code ?? item.student_code ?? '',
      name: item.name ?? item.student_name ?? 'Unnamed Student',
      mobile: item.mobile ?? '',
      parent: item.parent ?? item.parent_name ?? '',
      parentMobile: item.parentMobile ?? item.parent_mobile ?? '',
      cls: item.cls ?? item.class_name ?? '',
      course,
      courseId: String(item.courseId ?? item.course_id ?? ''),
      batch,
      batchId: String(item.batchId ?? item.batch_id ?? ''),
      feeType: item.feeType ?? item.fee_type ?? '',
      feeAmt: asNum(item.feeAmt ?? item.fee_amount ?? courseObj?.monthly),
      admission: toDateStr(item.admission ?? item.admission_date),
      status: item.status ?? 'Active',
      feeStatus: item.feeStatus ?? item.fee_status ?? 'Pending',
      att: asNum(item.att ?? item.attendance),
      gender: item.gender ?? '',
      dob: toDateStr(item.dob),
      address: item.address ?? '',
      school: item.school ?? item.school_name ?? ''
    };
  }

  function toApiPayload(s){
    return {
      name: s.name,
      mobile: s.mobile,
      parent: s.parent,
      parentMobile: s.parentMobile,
      cls: s.cls,
      course: s.course,
      courseId: s.courseId || undefined,
      batch: s.batch,
      batchId: s.batchId || undefined,
      feeType: s.feeType,
      feeAmt: s.feeAmt,
      admission: s.admission,
      status: s.status,
      feeStatus: s.feeStatus,
      att: s.att,
      gender: s.gender,
      dob: s.dob,
      school: s.school,
      address: s.address
    };
  }

  function readForm(b){
    const courseSel = b.querySelector('#f_course');
    const batchSel = b.querySelector('#f_batch');
    return {
      name: b.querySelector('#f_name').value.trim(),
      mobile: b.querySelector('#f_mobile').value.trim(),
      parent: b.querySelector('#f_parent').value.trim(),
      parentMobile: b.querySelector('#f_pmobile').value.trim(),
      cls: b.querySelector('#f_cls').value.trim(),
      course: courseSel.value,
      courseId: courseSel.selectedOptions[0]?.dataset.id || '',
      batch: batchSel.value,
      batchId: batchSel.selectedOptions[0]?.dataset.id || '',
      feeType: b.querySelector('#f_feetype').value,
      feeAmt: b.querySelector('#f_feeamt').value.trim(),
      admission: b.querySelector('#f_adm').value,
      status: b.querySelector('#f_status').value,
      feeStatus: b.querySelector('#f_fee_status').value,
      att: b.querySelector('#f_att').value.trim(),
      gender: b.querySelector('#f_gender').value,
      dob: b.querySelector('#f_dob').value,
      school: b.querySelector('#f_school').value.trim(),
      address: b.querySelector('#f_addr').value.trim()
    };
  }


  const cleanPhone = v => String(v || '').replace(/[^\d+]/g, '');

  function validateStudentForm(s){
    const required = [['name','student name'],['mobile','student mobile'],['parent','parent name'],['parentMobile','parent mobile'],['cls','class'],['course','course'],['feeType','fee type'],['admission','admission date']];
    const missing = required.find(([key]) => !s[key]);
    if (missing) return `Enter ${missing[1]}.`;
    const studentPhone = cleanPhone(s.mobile);
    const parentPhone = cleanPhone(s.parentMobile);
    if (!/^\+?[0-9]{7,15}$/.test(studentPhone)) return 'Enter a valid student mobile number.';
    if (!/^\+?[0-9]{7,15}$/.test(parentPhone)) return 'Enter a valid parent mobile number.';
    s.mobile = studentPhone;
    s.parentMobile = parentPhone;
    const fee = Number(s.feeAmt), attendance = Number(s.att);
    if (!Number.isFinite(fee) || fee < 0) return 'Fee amount must be zero or greater.';
    if (!Number.isFinite(attendance) || attendance < 0 || attendance > 100) return 'Attendance must be between 0 and 100.';
   if (s.dob) {
  const dobCheck = App.validateDob(s.dob);
  if (!dobCheck.valid) return dobCheck.msg;
  if (s.dob > s.admission) return 'Date of birth cannot be after admission date.';
}
return '';
  }

  window.exportStudents = () => {
    const columns = ['Student Code','Name','Mobile','Parent','Parent Mobile','Class','Course','Batch','Fee Type','Fee Amount','Admission Date','Status','Fee Status','Attendance','Gender','Date of Birth','School','Address'];
    const values = currentStudents.map(s => [s.code || s.id,s.name,s.mobile,s.parent,s.parentMobile,s.cls,s.course,s.batch,s.feeType,s.feeAmt,s.admission,s.status,s.feeStatus,s.att,s.gender,s.dob,s.school,s.address]);
    const csv = [columns, ...values].map(row => row.map(value => `"${String(value ?? '').replace(/"/g,'""')}"`).join(',')).join('\r\n');
    const link = document.createElement('a');
    link.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
    link.download = `students-${toDateStr(new Date())}.csv`;
    link.click();
    URL.revokeObjectURL(link.href);
  };

  function renderPage(rows, widgets){
    currentStudents = [...rows].sort((a, b) =>
    String(a.code || a.id).localeCompare(String(b.code || b.id), undefined, { numeric: true })
  );

  const total = widgets?.totalStudents ?? currentStudents.length;
  const active = widgets?.activeStudents ?? currentStudents.filter(s => s.status === 'Active').length;
  const due = widgets?.feeDueStudents ?? currentStudents.filter(s => s.feeStatus !== 'Paid').length;
  const avgAtt = widgets?.avgAttendance != null
    ? (typeof widgets.avgAttendance === 'string' ? widgets.avgAttendance.replace('%','') : widgets.avgAttendance)
    : (currentStudents.length ? Math.round(currentStudents.reduce((a,s)=>a + asNum(s.att), 0) / currentStudents.length) : 0);

    c.innerHTML = `<div class="kpi-grid" style="grid-template-columns:repeat(4,1fr)">
      <div class="kpi"><div class="top"><span class="label">Total Students</span><span class="ic b-brand">${App.svg('students')}</span></div><div class="val">${total}</div></div>
      <div class="kpi"><div class="top"><span class="label">Active</span><span class="ic b-green">${App.svg('check')}</span></div><div class="val">${active}</div></div>
      <div class="kpi"><div class="top"><span class="label">Fee Due</span><span class="ic b-red">${App.svg('pending')}</span></div><div class="val">${due}</div></div>
      <div class="kpi"><div class="top"><span class="label">Avg Attendance</span><span class="ic b-amber">${App.svg('attendance')}</span></div><div class="val">${avgAtt}%</div></div>
    </div><div id="tbl"></div>`;

    App.table('tbl', {
      rows: currentStudents,
      searchKeys:['id','code','name','mobile','parent','batch','course','cls'],
      searchPlaceholder:'Search by name, ID, mobile...',
      pageSize:10,
      filters:[
        {label:'All Classes',key:'cls',options:DB.classes || []},
        {label:'All Batches',key:'batch',options:unique(currentStudents.map(s=>s.batch))},
        {label:'Fee Type',key:'feeType',options:unique([...(DB.feeTypes||[]), ...currentStudents.map(s=>s.feeType)])},
        {label:'Status',key:'status',options:statuses},
        {label:'Fee Status',key:'feeStatus',options:feeStatuses}
      ],
      columns:[
        {key:'_index',label:'#',sort:false,render:(r,i)=>`<span class="t-sub">${i+1}</span>`},
        {key:'name',label:'Student',render:r=>App.whoCell(esc(r.name))},
        {key:'mobile',label:'Mobile',render:r=>`<div>${esc(r.mobile || '-')}</div>`},
        {key:'batch',label:'Batch',render:r=>`<div class="t-main" style="font-weight:500">${esc(r.batch || '-')}</div><div class="t-sub">${esc(r.course || '-')}</div>`},
        {key:'feeType',label:'Fee',render:r=>`<div>${esc(String(r.feeType || '-').replace(' Fee',''))}</div><div class="t-sub num">${App.money(r.feeAmt)}</div>`},
        {key:'att',label:'Attendance',num:true,render:r=>`<span class="num">${r.att}%</span>`},
        {key:'feeStatus',label:'Fee Status',render:r=>App.badge(esc(r.feeStatus || '-'))},
        {key:'status',label:'Status',render:r=>App.badge(esc(r.status || '-'))}
      ],
      actions:r=>`
        ${App.actBtn('eye','View',`onclick="viewStudent('${jsStr(r.id)}')"`) }
        ${App.actBtn('rupee','Collect Fee',`onclick="collectFee('${jsStr(r.id)}')"`) }
        ${App.actBtn('edit','Edit',`onclick="editStudent('${jsStr(r.id)}')"`) }`
    });
  }

  // Single call to /students now returns the student list, dashboard
  // widgets, AND course/batch dropdown data together (see
  // studentController.getStudents) - no more separate /courses or
  // /batches requests.
  async function loadStudents(){
    try {
      const payload = await API.get(API_BASE);
      usingFallback = false;
      courseList = Array.isArray(payload?.courses)
        ? payload.courses.map(mapCourseItem).filter(x => x.name)
        : (DB.courses || []).map(x => ({
            id: String(x.id ?? ''), name: x.name || '', code: x.id || '',
            monthlyFee: asNum(x.monthly),
            quarterlyFee: asNum(x.monthly) * 3,
            semiAnnualFee: asNum(x.monthly) * 6,
            annualFee: asNum(x.monthly) * 12
          }));
      batchList = Array.isArray(payload?.batches)
        ? payload.batches.map(mapBatchItem).filter(x => x.name)
        : (DB.batches || []).map(x => ({ id: String(x.id ?? ''), name: x.name || '', courseId: String(x.courseId ?? x.course_id ?? '') }));
      renderPage(unwrapList(payload).map(mapStudent), payload?.widgets);
    } catch (err) {
      console.warn('Students API unavailable, showing local data:', err);
      usingFallback = true;
      loadLocalDropdownData();
      renderPage(localStudents()); // no widgets → falls back to frontend calculation
      App.toast('Students API unavailable. Showing local data.', 'info');
    }
  }


  async function fetchStudentFull(id){
    if (usingFallback) {
      return {
        student: mapStudent(findLocalStudent(id)),
        extras: { fees: [], attendance: [], exams: [] }
      };
    }
    const raw = await API.get(`${API_BASE}/${encodeURIComponent(id)}`);
    const data = raw?.data ?? raw ?? {};
    const student = mapStudent(data.student ?? data);
    const extras = {
      fees: Array.isArray(data.fees) ? data.fees : [],
      attendance: Array.isArray(data.attendance) ? data.attendance : [],
      exams: Array.isArray(data.exams) ? data.exams : []
    };
    return { student, extras };
  }

  async function getStudent(id){
    const { student } = await fetchStudentFull(id);
    return student;
  }

  function emptyRow(colspan, text){
    return `<tr><td colspan="${colspan}" class="t-sub" style="text-align:center;padding:16px">${esc(text)}</td></tr>`;
  }

  // Replace the existing `showStudentModal` function in students.html with this version.
// It uses the new .stu-quickstats / .info-card / .stu-stat-row classes
// from student-modal-additions.css — add that CSS first.

function showStudentModal(s, extras){
  if (!s || !s.id) return App.toast('Student not found', 'err');
  extras = extras || { fees: [], attendance: [], exams: [] };

  const ledgerRows = extras.fees.length
    ? extras.fees.map(f => `<tr><td class="t-id">${esc(f.receipt ?? f.id ?? '-')}</td><td>${esc(f.period ?? '-')}</td><td class="num">${App.money(asNum(f.amount ?? f.paid))}</td><td>${esc(f.mode ?? '-')}</td><td>${esc(toDateStr(f.date) || '-')}</td></tr>`).join('')
    : emptyRow(5, 'No payment records available yet.');

  const attendanceRows = extras.attendance.length
    ? extras.attendance.map(a => `<tr><td>${esc(toDateStr(a.date) || '-')}</td><td>${App.badge(esc(a.status ?? '-'))}</td><td>${esc(a.remarks ?? '-')}</td></tr>`).join('')
    : emptyRow(3, 'No attendance records available yet.');

  const examRows = extras.exams.length
    ? extras.exams.map(e => `<tr><td>${esc(e.name ?? e.exam ?? '-')}</td><td class="num">${esc(e.obtained ?? e.score ?? '-')}/${esc(e.total ?? '-')}</td><td>${esc(e.grade ?? '-')}</td><td>${esc(e.remarks ?? '-')}</td></tr>`).join('')
    : emptyRow(4, 'No performance records available yet.');

  const paymentsMade = extras.fees.length;
  const lastPayment = extras.fees.length
    ? (toDateStr(extras.fees[extras.fees.length - 1].date) || '-')
    : '-';
  const presentCount = extras.attendance.filter(a => a.status === 'Present').length;
  const avgScore = extras.exams.length
    ? Math.round(extras.exams.reduce((sum, e) => {
        const obtained = asNum(e.obtained ?? e.score);
        const total = asNum(e.total) || 1;
        return sum + (obtained / total) * 100;
      }, 0) / extras.exams.length) + '%'
    : '-';

  App.modal({ size:'xl', title:esc(s.name), sub:`${esc(s.code || s.id)} · ${esc(s.cls || '-')} · ${esc(s.course || '-')}`,
    foot:`<button class="btn btn-light" onclick="location.href='student-details.html?id=${encodeURIComponent(s.id)}'">Open full profile</button><button class="btn btn-primary" data-close>Close</button>`,
    body:`
    <div class="detail-hero"><div class="av" style="background:var(--brand)">${esc((s.name||'?').split(' ').map(w=>w[0]).join(''))}</div>
      <div style="flex:1"><h3>${esc(s.name)}</h3><div class="meta">${esc(s.code || s.id)} · ${esc(s.batch || '-')}</div></div></div>

    <div class="stu-quickstats">
      <div class="qs-item"><span class="qs-label">Status</span><span class="qs-val">${App.badge(esc(s.status || '-'))}</span></div>
      <div class="qs-item"><span class="qs-label">Fee Status</span><span class="qs-val">${App.badge(esc(s.feeStatus || '-'))}</span></div>
      <div class="qs-item"><span class="qs-label">Attendance</span><span class="qs-val">${s.att}%</span></div>
      <div class="qs-item"><span class="qs-label">Admitted</span><span class="qs-val">${esc(s.admission || '-')}</span></div>
    </div>

    <div class="tabs" id="stTabs">
      <div class="tab active" data-t="p1">Profile</div><div class="tab" data-t="p2">Fees & Ledger</div>
      <div class="tab" data-t="p3">Attendance</div><div class="tab" data-t="p4">Performance</div></div>

    <div class="tab-pane active" data-p="p1">
      <div class="info-card">
        <div class="info-card-head">Personal Details</div>
        <div class="dl cols-3">
          <div class="it"><div class="k">Gender</div><div class="v">${esc(s.gender==='M'?'Male':s.gender==='F'?'Female':'-')}</div></div>
          <div class="it"><div class="k">Date of Birth</div><div class="v">${esc(s.dob || '-')}</div></div>
          <div class="it"><div class="k">Mobile</div><div class="v">${esc(s.mobile || '-')}</div></div>
          <div class="it"><div class="k">School</div><div class="v">${esc(s.school || '-')}</div></div>
          <div class="it"><div class="k">Class</div><div class="v">${esc(s.cls || '-')}</div></div>
          <div class="it"><div class="k">Address</div><div class="v">${esc(s.address || '-')}</div></div>
        </div>
      </div>
      <div class="info-card">
        <div class="info-card-head">Parent / Guardian</div>
        <div class="dl">
          <div class="it"><div class="k">Parent Name</div><div class="v">${esc(s.parent || '-')}</div></div>
          <div class="it"><div class="k">Parent Mobile</div><div class="v">${esc(s.parentMobile || '-')}</div></div>
        </div>
      </div>
      <div class="info-card">
        <div class="info-card-head">Course & Batch</div>
        <div class="dl cols-3">
          <div class="it"><div class="k">Course</div><div class="v">${esc(s.course || '-')}</div></div>
          <div class="it"><div class="k">Batch</div><div class="v">${esc(s.batch || '-')}</div></div>
          <div class="it"><div class="k">Admission Date</div><div class="v">${esc(s.admission || '-')}</div></div>
        </div>
      </div>
    </div>

    <div class="tab-pane" data-p="p2">
      <div class="stu-stat-row">
        <div class="stat"><div class="k">Fee Type</div><div class="v">${esc(s.feeType || '-')}</div></div>
        <div class="stat"><div class="k">Fee Amount</div><div class="v">${App.money(s.feeAmt)}</div></div>
        <div class="stat"><div class="k">Payments Made</div><div class="v">${paymentsMade}${paymentsMade ? ` <span class="t-sub" style="font-size:11px">(last: ${esc(lastPayment)})</span>` : ''}</div></div>
      </div>
      ${s.feeStatus && s.feeStatus!=='Paid'?`
      <div class="info-card" style="background:var(--red-soft);border-color:#f3cfc7">
        <div class="info-card-head" style="color:var(--red);border-color:#f3cfc7">Pending Dues</div>
        <div class="pl-line minus" style="background:transparent;padding:0"><span>${esc(s.feeType || 'Fee')} · current period</span><span class="v">${App.money(s.feeAmt)}</span></div>
      </div>`:''}
      <div class="stu-section-label">Payment Ledger</div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Receipt</th><th>Period</th><th class="num">Amount</th><th>Mode</th><th>Date</th></tr></thead>
      <tbody>${ledgerRows}</tbody></table></div>
    </div>

    <div class="tab-pane" data-p="p3">
      <div class="stu-stat-row">
        <div class="stat"><div class="k">Overall Attendance</div><div class="v">${s.att}%</div></div>
        <div class="stat"><div class="k">Days Present</div><div class="v">${presentCount} / ${extras.attendance.length || 0}</div></div>
        <div class="stat"><div class="k">Records</div><div class="v">${extras.attendance.length}</div></div>
      </div>
      <div class="stu-section-label">Attendance Records</div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Date</th><th>Status</th><th>Remarks</th></tr></thead>
      <tbody>${attendanceRows}</tbody></table></div>
    </div>

    <div class="tab-pane" data-p="p4">
      <div class="stu-stat-row">
        <div class="stat"><div class="k">Tests Taken</div><div class="v">${extras.exams.length}</div></div>
        <div class="stat"><div class="k">Average Score</div><div class="v">${avgScore}</div></div>
      </div>
      <div class="stu-section-label">Test Performance</div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Test</th><th class="num">Score</th><th>Grade</th><th>Remark</th></tr></thead>
      <tbody>${examRows}</tbody></table></div>
    </div>`,
    onOpen:b=>{ b.querySelectorAll('#stTabs .tab').forEach(t=>t.onclick=()=>{
      b.querySelectorAll('#stTabs .tab').forEach(x=>x.classList.remove('active'));
      b.querySelectorAll('.tab-pane').forEach(x=>x.classList.remove('active'));
      t.classList.add('active'); b.querySelector(`[data-p="${t.dataset.t}"]`).classList.add('active'); }); }
  });
}

  window.viewStudent = async id => {
    try {
      const { student, extras } = await fetchStudentFull(id);
      showStudentModal(student, extras);
    }
    catch (err) { App.toast(err.message || 'Failed to load student', 'err'); }
  };


  function studentForm(s){
    const editMode = !!s;
    const lockAttr = editMode ? 'disabled' : '';
    const lockClass = editMode ? 'locked-field' : '';
    const classOptions = DB.classes || [];
    const feeTypeOptions = unique(['Regular Fee','Scholarship', ...(DB.feeTypes||[]), ...currentStudents.map(x=>x.feeType)]);

    const courseOpts = courseList.length ? courseList
      : unique(currentStudents.map(x=>x.course)).map(name => ({ id:'', name }));
    const allBatchOpts = batchList.length ? batchList
      : unique(currentStudents.map(x=>x.batch)).map(name => ({ id:'', name, courseId:'' }));
    // Browsers auto-select the first <option> when nothing is explicitly
    // marked selected (Add mode), so the batch list has to be filtered
    // against that same default course, not just against s?.courseId.
    const initialCourseId = s?.courseId || (courseOpts[0]?.id ?? '');
    const batchOpts = allBatchOpts.filter(b => !b.courseId || b.courseId === initialCourseId);

    return `<div class="form-grid">
       <div><label>Full Name</label><input id="f_name" maxlength="120" placeholder="e.g. Aarav Sharma" required value="${esc(s?.name || '')}"></div>
       <div><label>Mobile</label><input id="f_mobile" type="tel" inputmode="numeric" placeholder="e.g. 9876543210" required value="${esc(s?.mobile || '')}"></div>
       <div><label>Parent Name</label><input id="f_parent" placeholder="e.g. Rakesh Sharma" required value="${esc(s?.parent || '')}"></div>
       <div><label>Parent Mobile</label><input id="f_pmobile" type="tel" inputmode="numeric" placeholder="e.g. 9876543211" required value="${esc(s?.parentMobile || '')}"></div>
      <div><label>Class / Standard</label><select id="f_cls" class="${lockClass}" ${lockAttr}>${classOptions.map(x=>`<option ${s?.cls===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div>
      <div><label>Course</label><select id="f_course" class="${lockClass}" ${lockAttr}>${courseOpts.map(cItem=>`<option value="${esc(cItem.name)}" data-id="${esc(cItem.id)}" ${(s?.courseId && s.courseId===cItem.id) || (!s?.courseId && s?.course===cItem.name)?'selected':''}>${esc(cItem.name)}${cItem.code?` (${esc(cItem.code)})`:''}</option>`).join('')}</select></div>
      <div><label>Batch</label><select id="f_batch" class="${lockClass}" ${lockAttr}><option value="" data-id="">— No batch —</option>${batchOpts.map(bItem=>`<option value="${esc(bItem.name)}" data-id="${esc(bItem.id)}" ${s?.batch===bItem.name?'selected':''}>${esc(bItem.name)}</option>`).join('')}</select></div>
      <div><label>Fee Type</label><select id="f_feetype" class="${lockClass}" ${lockAttr}>${feeTypeOptions.map(x=>`<option ${s?.feeType===x?'selected':''}>${x}</option>`).join('')}</select></div>
       <div><label>Fee Amount</label><input class="num ${lockClass}" id="f_feeamt" type="number" min="0" step="0.01" placeholder="0.00" required value="${esc(s?.feeAmt ?? 0)}" ${lockAttr}></div>
       <div><label>Attendance %</label><input class="num ${lockClass}" id="f_att" type="number" min="0" max="100" step="1" placeholder="0-100" required value="${esc(s?.att ?? 0)}" ${lockAttr}></div>
      <div><label>Fee Status</label><select id="f_fee_status" class="${lockClass}" ${lockAttr}>${feeStatuses.map(x=>`<option ${s?.feeStatus===x?'selected':''}>${x}</option>`).join('')}</select></div>
      <div><label>Admission Date</label><input type="date" id="f_adm" class="${lockClass}" value="${esc(s?.admission || toDateStr(new Date()))}" ${lockAttr}></div>
      <div><label>Status</label><select id="f_status" class="${lockClass}" ${lockAttr}>${statuses.map(x=>`<option ${s?.status===x?'selected':''}>${x}</option>`).join('')}</select></div>
      <div><label>Gender</label><select id="f_gender"><option value="M" ${s?.gender==='M'?'selected':''}>Male</option><option value="F" ${s?.gender==='F'?'selected':''}>Female</option></select></div>
    <div><label>Date of Birth</label><input type="date" id="f_dob" max="${toDateStr(new Date())}" value="${esc(s?.dob || '')}"><div class="field-error" id="f_dob_error"></div></div>
      <div><label>School</label><input id="f_school" placeholder="e.g. Delhi Public School" value="${esc(s?.school || '')}"></div>
      <div class="full"><label>Address</label><input id="f_addr" placeholder="House no., street, city" value="${esc(s?.address || '')}"></div>
      ${editMode ? `<div class="full t-sub">Academic and fee details are locked here - update them from Batches, Fee Collection, or Admissions instead.</div>` : ''}
    </div>`;
  }

  window.addStudent = () => App.modal({ size:'lg', title:'Add New Student', sub:'Create a student admission record',
    body:studentForm(null),
    foot:`<button class="btn btn-light" data-close>Cancel</button><button class="btn btn-primary" id="saveBtn">Save Student</button>`,
    onOpen:b=>{
      const courseSel = b.querySelector('#f_course');
      const batchSel = b.querySelector('#f_batch');
      const feeTypeSel = b.querySelector('#f_feetype');
      const feeAmtInput = b.querySelector('#f_feeamt');

      const refreshBatchOptions = () => {
        const selectedCourseId = courseSel.selectedOptions[0]?.dataset.id || '';
        const opts = batchesForCourse(selectedCourseId);
        const prevValue = batchSel.value;
        batchSel.innerHTML = `<option value="" data-id="">— No batch —</option>` +
          opts.map(bItem=>`<option value="${esc(bItem.name)}" data-id="${esc(bItem.id)}">${esc(bItem.name)}</option>`).join('');
        // Keep the previous batch selected only if it still belongs to the newly selected course
        if (opts.some(o => o.name === prevValue)) batchSel.value = prevValue;
      };

      const refreshFeeAmount = () => {
        const selectedCourseId = courseSel.selectedOptions[0]?.dataset.id || '';
        const fee = courseFeeFor(selectedCourseId, feeTypeSel.value);
        if (fee != null) feeAmtInput.value = fee;
      };

      courseSel.onchange = () => { refreshBatchOptions(); refreshFeeAmount(); };
      feeTypeSel.onchange = refreshFeeAmount;
      // Run once immediately: the browser auto-selects the first Course and
      // Fee Type option since neither is marked "selected" in Add mode, so
      // Batch/Fee Amount need to match that default right away, not just
      // after the admin manually changes something.
      refreshBatchOptions();
      refreshFeeAmount();

      b.querySelector('#saveBtn').onclick=async()=>{
      const s = readForm(b);
      const validationError = validateStudentForm(s);
      if (validationError) return App.toast(validationError,'err');
      try {
        if (usingFallback) {
          const cobj = (DB.courses||[]).find(c=>c.name===s.course) || {};
          DB.students.unshift({ id:'STU-'+(1001+DB.students.length), ...s, feeAmt: s.feeAmt || cobj.monthly || 0 });
          App.closeModal();
          renderPage(localStudents());
          return App.toast('Student added locally','ok');
        }
        await API.post(API_BASE, toApiPayload(s));
        App.closeModal();
        await loadStudents();
        App.toast('Student added successfully','ok');
      } catch (err) {
        App.toast(err.message || 'Failed to add student','err');
      }
    }
  }
  });

  window.editStudent = async id => {
    try {
      const s = await getStudent(id);
      if (!s || !s.id) return App.toast('Student not found','err');
      App.modal({ size:'lg', title:'Edit Student', sub:esc(s.code || s.id), body:studentForm(s),
        foot:`<button class="btn btn-light" data-close>Cancel</button><button class="btn btn-primary" id="saveBtn">Save Changes</button>`,
        onOpen:b=>b.querySelector('#saveBtn').onclick=async()=>{
          const updated = readForm(b);
          const validationError = validateStudentForm(updated);
          if (validationError) return App.toast(validationError,'err');
          try {
            if (usingFallback) {
              const local = findLocalStudent(id);
              if (local) Object.assign(local, updated);
              App.closeModal();
              renderPage(localStudents());
              return App.toast('Student updated locally','ok');
            }
            await API.put(`${API_BASE}/${encodeURIComponent(s.id)}`, toApiPayload(updated));
            App.closeModal();
            await loadStudents();
            App.toast('Student updated','ok');
          } catch (err) {
            App.toast(err.message || 'Failed to update student','err');
          }
        }
      });
    } catch (err) {
      App.toast(err.message || 'Could not fetch student','err');
    }
  };


  window.collectFee = async id => {
    const s = findCurrentStudent(id) || await getStudent(id).catch(()=>null);
    if (!s) return App.toast('Student not found','err');


    const now = new Date();

    const feeTypeLower = String(s.feeType || '').toLowerCase();
    const defaultPeriodType = feeTypeLower.includes('quarter') ? 'quarterly'
      : feeTypeLower.includes('half') || feeTypeLower.includes('semi') ? 'half'
      : feeTypeLower.includes('annual') || feeTypeLower.includes('year') ? 'yearly'
      : 'monthly';

    const buildPeriodLabel = (b) => {
      const type = b.querySelector('#cf_period_type').value;
      const year = b.querySelector('#cf_year').value.trim();
      if (type === 'monthly') return `${b.querySelector('#cf_month').value} ${year}`;
      if (type === 'quarterly') return `${b.querySelector('#cf_quarter').value} ${year}`;
      if (type === 'half') return `${b.querySelector('#cf_half').value} ${year}`;
      return year;
    };

    const fetchDue = async (period) => {
      if (usingFallback) return s.feeAmt;
      try {
        const payload = await API.get(`/pending-fees/${encodeURIComponent(s.code || s.id)}?feeType=${encodeURIComponent(s.feeType)}&period=${encodeURIComponent(period)}`);
        const row = payload?.data;
        
        return (row && row.due != null) ? Number(row.due) : s.feeAmt;
      } catch (err) {
        console.warn('Could not fetch current due, falling back to course fee:', err);
        return s.feeAmt;
      }
    };

    const defaultMonth = monthNames[now.getMonth()];
    const defaultQuarter = quarters[Math.floor(now.getMonth()/3)].value;
    const defaultHalf = now.getMonth() < 6 ? 'H1' : 'H2';
    const defaultYear = now.getFullYear();
    const defaultInitialPeriod = defaultPeriodType === 'quarterly' ? `${defaultQuarter} ${defaultYear}`
      : defaultPeriodType === 'half' ? `${defaultHalf} ${defaultYear}`
      : defaultPeriodType === 'yearly' ? `${defaultYear}`
      : `${defaultMonth} ${defaultYear}`;

    const initialDue = await fetchDue(defaultInitialPeriod);
    const initialAlreadyPaid = initialDue <= 0;
   
    const paidBtnStyle = 'background:#c9ccd3;border-color:#c9ccd3;color:#6b7280;cursor:not-allowed;box-shadow:none;';

    App.modal({ size:'lg', title:'Collect Fee', sub:`${esc(s.name)} - ${esc(s.batch || s.course || '-')}`,
      body:`<div class="form-grid">
        <div><label>Fee Type</label><input value="${esc(s.feeType || '-')}" disabled></div>
        <div><label>Period Type</label><select id="cf_period_type">
          <option value="monthly" ${defaultPeriodType==='monthly'?'selected':''}>Monthly</option>
          <option value="quarterly" ${defaultPeriodType==='quarterly'?'selected':''}>Quarterly</option>
          <option value="half" ${defaultPeriodType==='half'?'selected':''}>Half-Yearly</option>
          <option value="yearly" ${defaultPeriodType==='yearly'?'selected':''}>Yearly</option>
        </select></div>
        <div id="cf_month_wrap" style="${defaultPeriodType==='monthly'?'':'display:none'}"><label>Month</label><select id="cf_month">${monthNames.map(m=>`<option ${m===defaultMonth?'selected':''}>${m}</option>`).join('')}</select></div>
        <div id="cf_quarter_wrap" style="${defaultPeriodType==='quarterly'?'':'display:none'}"><label>Quarter</label><select id="cf_quarter">${quarters.map(q=>`<option value="${q.value}" ${q.value===defaultQuarter?'selected':''}>${q.label}</option>`).join('')}</select></div>
        <div id="cf_half_wrap" style="${defaultPeriodType==='half'?'':'display:none'}"><label>Half</label><select id="cf_half">${halves.map(h=>`<option value="${h.value}" ${h.value===defaultHalf?'selected':''}>${h.label}</option>`).join('')}</select></div>
        <div><label>Year</label><input type="number" id="cf_year" value="${defaultYear}" min="2000" max="2100" step="1"></div>
        <div><label>Due Amount</label><input class="num" id="cf_due" value="${esc(initialDue)}" disabled></div>
        <div><label>Discount</label><input class="num" id="cf_disc" type="number" min="0" step="0.01" value="0"></div>
        <div><label>Late Fine</label><input class="num" id="cf_fine" type="number" min="0" step="0.01" value="0"></div>
        <div><label>Paid Amount</label><input class="num" id="cf_paid" type="number" min="0" step="0.01" max="${esc(initialDue)}" value="${esc(initialDue)}"></div>
        <div><label>Payment Mode</label><select id="cf_mode">${(DB.modes||[]).map(m=>`<option>${m}</option>`).join('')}</select></div>
        <div><label>Transaction ID</label><input id="cf_txn" placeholder="UPI / Ref no."></div>
        <div class="full"><label>Remarks</label><input id="cf_rem" placeholder="Optional note"></div></div>
        <div class="full" id="cf_already_paid" style="display:${initialAlreadyPaid ? 'block' : 'none'};color:var(--green);font-size:12.5px;font-weight:600;padding-top:4px">
  ✓ Fees already paid for this period.
</div>
        <div class="full" id="cf_overpay_error" style="display:none;color:var(--red);font-size:12.5px;font-weight:600;padding-top:4px">
  Paid amount cannot exceed the amount due for this period. To pay ahead, collect fee again and select the next period.
</div>`,
      foot:`<button class="btn btn-light" data-close>Cancel</button><button class="btn btn-primary" id="cfSave" ${initialAlreadyPaid ? `disabled style="${paidBtnStyle}"` : ''}>Collect & Generate Receipt</button>`,
      onOpen:b=>{
       const paidInput = b.querySelector('#cf_paid');
       const discInput = b.querySelector('#cf_disc');
       const fineInput = b.querySelector('#cf_fine');
       const dueInput = b.querySelector('#cf_due');
       const saveBtn = b.querySelector('#cfSave');
       const alreadyPaidMsg = b.querySelector('#cf_already_paid');
       const overpayMsg = b.querySelector('#cf_overpay_error');


       const getPayable = () => {
         const due = Number(dueInput.value) || 0;
         const discount = Number(discInput.value) || 0;
         const fine = Number(fineInput.value) || 0;
         return Math.max(0, due - discount + fine);
       };

       const updateSaveButtonState = () => {
         const due = Number(dueInput.value) || 0;
         const payable = getPayable();
         const paid = Number(paidInput.value) || 0;
         const isPeriodPaid = due <= 0;
         const isOverpaying = !isPeriodPaid && paid > payable;

         paidInput.max = payable;
         alreadyPaidMsg.style.display = isPeriodPaid ? 'block' : 'none';
         overpayMsg.style.display = isOverpaying ? 'block' : 'none';

         if (isPeriodPaid || isOverpaying) {
           saveBtn.disabled = true;
           saveBtn.style.cssText = paidBtnStyle;
         } else {
           saveBtn.disabled = false;
           saveBtn.style.cssText = '';
         }
       };

       const refreshDue = async () => {
  const period = buildPeriodLabel(b);
  const due = await fetchDue(period);
  dueInput.value = due;
  paidInput.value = due;
  discInput.value = 0;
  fineInput.value = 0;
  updateSaveButtonState();
};

        [paidInput, discInput, fineInput].forEach(el => el.addEventListener('input', updateSaveButtonState));
        updateSaveButtonState();

        b.querySelector('#cf_period_type').onchange = (e) => {
          b.querySelector('#cf_month_wrap').style.display = e.target.value === 'monthly' ? '' : 'none';
          b.querySelector('#cf_quarter_wrap').style.display = e.target.value === 'quarterly' ? '' : 'none';
          b.querySelector('#cf_half_wrap').style.display = e.target.value === 'half' ? '' : 'none';
          refreshDue();
        };
        ['#cf_month','#cf_quarter','#cf_half','#cf_year'].forEach(sel => {
          b.querySelector(sel).onchange = refreshDue;
        });

        b.querySelector('#cfSave').onclick = async () => {
          try {
            if (usingFallback) {
              const local = findLocalStudent(id);
              if (local) local.feeStatus = 'Paid';
              App.closeModal();
              renderPage(localStudents());
              return App.toast('Fee collected locally','ok');
            }
            const due = Number(b.querySelector('#cf_due').value);
            const discount = Number(b.querySelector('#cf_disc').value);
            const fine = Number(b.querySelector('#cf_fine').value);
            const paid = Number(b.querySelector('#cf_paid').value);
            const period = buildPeriodLabel(b);
            const year = Number(b.querySelector('#cf_year').value);
            if (!Number.isInteger(year) || year < 2000 || year > 2100) throw new Error('Enter a valid year.');
            if (![due, discount, fine, paid].every(Number.isFinite) || due < 0 || discount < 0 || fine < 0 || paid < 0) throw new Error('Enter valid non-negative fee amounts.');
            const payable = Math.max(0, due - discount + fine);
            if (paid > payable) throw new Error(`Paid amount cannot exceed the amount due (${App.money(payable)}) for this period.`);

const balance = Math.max(0, due - discount + fine - paid);
await API.post('/fees/collect', {
  studentId: s.code || s.id,
  student: s.name,
  batch: s.batch || '',
  feeType: s.feeType || '',
  period, due, discount, fine, paid,
  mode: b.querySelector('#cf_mode').value,
  txn: b.querySelector('#cf_txn').value.trim(),
  collectedBy: App.me().name || 'Admin',
  date: toDateStr(new Date()),
  balance,
  remarks: b.querySelector('#cf_rem').value.trim()
});
App.closeModal();
await loadStudents(); // fee_status now comes back correct from the backend
App.toast('Fee collected and receipt generated','ok');
          } catch (err) {
            App.toast(err.message || 'Failed to collect fee','err');
          }
        };
      }
    });
  };

  (async () => {
    await loadStudents();
  })();
}
</script>
</body></html>
