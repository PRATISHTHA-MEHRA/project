<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exams · BrightPath Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/admin-style.css">
</head>
<body>
  <script src="assets/js/admin-data.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/admin-app.js"></script>
  <script>
  if (App.guard()) {
    let examsList = [];
    let courseNames = [];
    let batchNames = [];
    let teacherNames = [];

    function unwrapList(payload) {
      if (Array.isArray(payload)) return payload;
      if (Array.isArray(payload?.data)) return payload.data;
      if (Array.isArray(payload?.rows)) return payload.rows;
      if (Array.isArray(payload?.result)) return payload.result;
      return [];
    }

    function nameOf(row, keys) {
      for (const k of keys) {
        if (row && row[k]) return row[k];
      }
      return '';
    }

    const head = `<button class="btn btn-primary" onclick="addExam()">${App.svg('plus')}Create Test</button>`;
    const c = App.layout('exams', 'Exams & Tests', [`<span>Assessment</span>`, 'Exams'], head);
    c.innerHTML = `<div id="tbl"></div>`;

    function renderTable() {
      App.table('tbl', {
        rows: examsList,
        searchKeys: ['id', 'name', 'course', 'batch', 'subject'],
        searchPlaceholder: 'Search tests…',
        pageSize: 9,
        dateFilter: true,
        filters: [
          { label: 'Batch', key: 'batch', options: [...new Set(examsList.map(e => e.batch))] },
          { label: 'Status', key: 'status', options: ['Scheduled', 'Completed', 'Result Published'] }
        ],
        columns: [
          { key: 'name', label: 'Test', render: r => `<div class="t-main">${r.name}</div><div class="t-sub">${r.id} · ${r.subject || 'N/A'}</div>` },
          { key: 'batch', label: 'Batch / Course', render: r => `<div>${r.batch || 'N/A'}</div><div class="t-sub">${r.course || 'N/A'}</div>` },
          { key: 'teacher', label: 'Teacher', render: r => App.whoCell(r.teacher || 'Unassigned') },
          { key: 'date', label: 'Test Date' },
          { key: 'total', label: 'Marks', num: true, render: r => `${r.total} <span class="t-sub">(pass ${r.pass})</span>` },
          { key: 'status', label: 'Status', render: r => App.badge(r.status) }
        ],
        actions: r => `
          ${App.actBtn('eye', 'View', `onclick="viewEx('${r.id}')"`)}
          ${App.actBtn('marks', 'Add Marks', `onclick="location.href='marks.html'"`)}
          ${App.actBtn('edit', 'Edit', `onclick="editEx('${r.id}')"`)}
          ${App.actBtn('trash', 'Delete', `onclick="deleteEx('${r.id}')" class="text-danger"`)}
        `
      });
    }

    async function loadExams() {
      try {
        const res = await API.get('/exams');
        examsList = unwrapList(res);
      } catch (err) {
        App.toast(err.message || 'Failed to load exams', 'err');
        examsList = [];
      }
      renderTable();
    }

    async function loadFormOptions() {
      try {
        const [coursesRes, batchesRes, teachersRes] = await Promise.all([
          API.get('/courses'), API.get('/batches'), API.get('/teachers')
        ]);
        courseNames = unwrapList(coursesRes).map(r => nameOf(r, ['name', 'courseName', 'course_name'])).filter(Boolean);
        batchNames = unwrapList(batchesRes).map(r => nameOf(r, ['name', 'batchName', 'batch_name'])).filter(Boolean);
        teacherNames = unwrapList(teachersRes).map(r => nameOf(r, ['name', 'teacherName', 'teacher_name'])).filter(Boolean);
      } catch (err) {
        App.toast('Failed to load system choices — using defaults', 'err');
        courseNames = typeof DB !== 'undefined' && DB.courses ? DB.courses.map(c => c.name) : [];
        batchNames = typeof DB !== 'undefined' && DB.batches ? DB.batches.map(b => b.name) : [];
        teacherNames = typeof DB !== 'undefined' && DB.teachers ? DB.teachers.map(t => t.name) : [];
      }
    }

    loadExams();
    loadFormOptions();

    const find = id => examsList.find(e => e.id === id);

    window.viewEx = id => {
      const x = find(id);
      if (!x) return;
      App.modal({
        size: 'md',
        title: x.name,
        sub: x.id,
        body: `
          <div class="dl cols-2">
            <div class="it"><div class="k">Course</div><div class="v">${x.course || 'N/A'}</div></div>
            <div class="it"><div class="k">Batch</div><div class="v">${x.batch || 'N/A'}</div></div>
            <div class="it"><div class="k">Subject</div><div class="v">${x.subject || 'N/A'}</div></div>
            <div class="it"><div class="k">Teacher</div><div class="v">${x.teacher || 'Unassigned'}</div></div>
            <div class="it"><div class="k">Date</div><div class="v">${x.date}</div></div>
            <div class="it"><div class="k">Total / Pass</div><div class="v">${x.total} / ${x.pass}</div></div>
            <div class="it"><div class="k">Status</div><div class="v">${App.badge(x.status)}</div></div>
          </div>
          <div class="sec-title">Syllabus</div>
          <p style="color:var(--ink-2)">${x.syllabus || 'No syllabus provided.'}</p>
        `,
        foot: `<button class="btn btn-light" data-close>Close</button><button class="btn btn-primary" onclick="App.closeModal();location.href='marks.html'">View Marks</button>`
      });
    };

    function optionList(names, selected) {
      if (!names || names.length === 0) return '<option value="">No options available</option>';
      return names.map(n => `<option value="${n}" ${selected === n ? 'selected' : ''}>${n}</option>`).join('');
    }

    function exForm(x) {
      const today = new Date().toISOString().split('T')[0];
      return `
        <div class="form-grid">
          <div class="full"><label>Test Name</label><input id="x_name" value="${x ? x.name : ''}" placeholder="e.g. Mid-Term Examination"></div>
          <div><label>Course</label><select id="x_course">${optionList(courseNames, x ? x.course : null)}</select></div>
          <div><label>Batch</label><select id="x_batch">${optionList(batchNames, x ? x.batch : null)}</select></div>
          <div><label>Subject</label><input id="x_sub" value="${x ? x.subject : ''}" placeholder="e.g. Mathematics"></div>
          <div><label>Teacher</label><select id="x_teacher">${optionList(teacherNames, x ? x.teacher : null)}</select></div>
          <div><label>Test Date</label><input type="date" id="x_date" value="${x ? x.date : today}"></div>
          <div><label>Total Marks</label><input class="num" id="x_total" type="number" value="${x ? x.total : '100'}"></div>
          <div><label>Passing Marks</label><input class="num" id="x_pass" type="number" value="${x ? x.pass : '33'}"></div>
          <div><label>Status</label><select id="x_status">${['Scheduled', 'Completed', 'Result Published'].map(s => `<option ${x && x.status === s ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
          <div class="full"><label>Syllabus</label><input id="x_syll" value="${x ? x.syllabus : ''}" placeholder="Key topics covered..."></div>
        </div>
      `;
    }

    function readExForm(b) {
      return {
        name: b.querySelector('#x_name').value.trim(),
        course: b.querySelector('#x_course').value,
        batch: b.querySelector('#x_batch').value,
        subject: b.querySelector('#x_sub').value.trim(),
        teacher: b.querySelector('#x_teacher').value,
        date: b.querySelector('#x_date').value,
        total: parseInt(b.querySelector('#x_total').value) || 100,
        pass: parseInt(b.querySelector('#x_pass').value) || 33,
        status: b.querySelector('#x_status').value,
        syllabus: b.querySelector('#x_syll').value.trim()
      };
    }

    window.addExam = () => App.modal({
      size: 'lg',
      title: 'Create Test',
      body: exForm(null),
      foot: `<button class="btn btn-light" data-close>Cancel</button><button class="btn btn-primary" id="sv">Create Test</button>`,
      onOpen: b => {
        b.querySelector('#sv').onclick = async () => {
          const btn = b.querySelector('#sv');
          const payload = readExForm(b);

          if (!payload.name) return App.toast('Enter test name', 'err');
          if (!payload.date) return App.toast('Pick a test date', 'err');

          try {
            btn.disabled = true;
            btn.innerText = 'Creating...';
            await API.post('/exams', payload);
            App.closeModal();
            App.toast('Test created successfully', 'ok');
            loadExams();
          } catch (err) {
            btn.disabled = false;
            btn.innerText = 'Create Test';
            App.toast(err.message || 'Failed to create test', 'err');
          }
        };
      }
    });

    window.editEx = id => {
      const x = find(id);
      if (!x) return;

      App.modal({
        size: 'lg',
        title: 'Edit Test',
        sub: x.id,
        body: exForm(x),
        foot: `<button class="btn btn-light" data-close>Cancel</button><button class="btn btn-primary" id="sv">Save Changes</button>`,
        onOpen: b => {
          b.querySelector('#sv').onclick = async () => {
            const btn = b.querySelector('#sv');
            const payload = readExForm(b);

            if (!payload.name) return App.toast('Enter test name', 'err');

            try {
              btn.disabled = true;
              btn.innerText = 'Saving...';
              await API.put(`/exams/${x.id}`, payload);
              App.closeModal();
              App.toast('Test updated successfully', 'ok');
              loadExams();
            } catch (err) {
              btn.disabled = false;
              btn.innerText = 'Save Changes';
              App.toast(err.message || 'Failed to update test', 'err');
            }
          };
        }
      });
    };

    window.deleteEx = id => {
      const x = find(id);
      if (!x) return;

      App.modal({
        size: 'sm',
        title: 'Delete Test',
        body: `<p>Are you sure you want to delete test <strong>${x.name}</strong> (${x.id})? This action cannot be undone.</p>`,
        foot: `<button class="btn btn-light" data-close>Cancel</button><button class="btn btn-danger" id="confirm_del">Delete</button>`,
        onOpen: b => {
          b.querySelector('#confirm_del').onclick = async () => {
            const btn = b.querySelector('#confirm_del');
            try {
              btn.disabled = true;
              btn.innerText = 'Deleting...';
              await API.delete(`/exams/${id}`);
              App.closeModal();
              App.toast('Test deleted successfully', 'ok');
              loadExams();
            } catch (err) {
              btn.disabled = false;
              btn.innerText = 'Delete';
              App.toast(err.message || 'Failed to delete test', 'err');
            }
          };
        }
      });
    };
  }
  </script>
</body>
</html>
